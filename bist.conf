# ESP-BIST configuration for the safe GPIO example (ESP32-P4 standalone).
#
# Keep this list minimal: only the tests this application actually calls.

# HP core 1 dispatch. Required by every reciprocal test and by the reciprocal
# GPIO input read the safe GPIO driver uses.
CONFIG_ESP_BIST_MULTICORE=y

# Static GPIO plausibility tests plus the reciprocal GPIO input test
# (IEC 60730 H.2.18.15) on ESP32-P4.
CONFIG_ESP_BIST_GPIO_TEST=y
CONFIG_ESP_BIST_GPIO_TEST_RECIPROCAL=y

# Watchdog supervising the safety loop. The loop period is 1 ms; the margin
# absorbs one UART log line at 115200 baud.
CONFIG_ESP_BIST_WDT_TIMEOUT_US=200000

CONFIG_ESP_BIST_LOG_LEVEL_INFO=y
